<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Mahasiswa - MSI Glowing Dragon</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #050505, #110404, #1a0606);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Canvas untuk Naga & Kelopak Bunga */
        #effectsCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Elemen Pendaran Merah di Background */
        .bg-shapes div {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.25;
            animation: float 8s infinite alternate ease-in-out;
        }
        .shape1 { width: 350px; height: 350px; background: #ff003c; top: 10%; left: 15%; }
        .shape2 { width: 300px; height: 300px; background: #990000; bottom: 10%; right: 15%; animation-delay: 3s; }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-30px) scale(1.05); }
        }

        /* Kartu Profil Utama */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(15, 15, 18, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 0, 60, 0.35);
            max-width: 540px;
            width: 90%;
            margin: 20px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 0, 60, 0.2);
            text-align: center;
        }

        /* Badge Mahasiswa */
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #ff003c, #b30000);
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(255, 0, 60, 0.5);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #a1a1aa;
            margin-bottom: 25px;
        }

        /* Efek Ketikan Otomatis */
        .typing-container {
            font-size: 1.05rem;
            color: #ff3355;
            margin-bottom: 30px;
            font-weight: 500;
            min-height: 30px;
        }
        .typed-text {
            border-right: 2px solid #ff3355;
            padding-right: 4px;
            animation: blink 0.75s infinite;
        }
        @keyframes blink {
            0%, 100% { border-color: transparent; }
            50% { border-color: #ff3355; }
        }

        /* Kotak Keahlian (Tags) */
        .skills-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 35px;
        }

        .skill-tag {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #f4f4f5;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .skill-tag:hover {
            background: rgba(255, 0, 60, 0.15);
            border-color: #ff003c;
            color: #ff99aa;
            transform: translateY(-3px);
        }

        /* Statistik / Informasi Angka */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-item h3 {
            font-size: 1.25rem;
            color: #ff3355;
            font-weight: 700;
        }

        .stat-item p {
            font-size: 0.8rem;
            color: #a1a1aa;
            margin-top: 4px;
        }

        /* Tombol Kontak */
        .btn-contact {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #ff003c, #990000);
            color: white;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 10px 25px rgba(255, 0, 60, 0.4);
            transition: all 0.3s ease;
        }

        .btn-contact:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(255, 0, 60, 0.7);
            background: linear-gradient(135deg, #ff3355, #ff003c);
        }

        .email-text {
            display: block;
            margin-top: 15px;
            font-size: 0.85rem;
            color: #a1a1aa;
        }
    </style>
</head>
<body>

    <!-- Canvas Gabungan Efek -->
    <canvas id="effectsCanvas"></canvas>

    <!-- Elemen Latar Belakang Merah -->
    <div class="bg-shapes">
        <div class="shape1"></div>
        <div class="shape2"></div>
    </div>

    <!-- Kartu Profil Utama -->
    <div class="card">
        <span class="badge"><i class="fa-solid fa-graduation-cap"></i> Mahasiswa</span>
        <h1>Nama Silvia</h1>
        <p class="subtitle">Manajemen Informasi Komunikasi</p>

        <!-- Efek Ketikan Otomatis -->
        <div class="typing-container">
            <span class="typed-text" id="typedOutput"></span>
        </div>

        <!-- Keahlian -->
        <div class="skills-container">
            <div class="skill-tag"><i class="fa-solid fa-cloud"></i> Cloud Computing</div>
            <div class="skill-tag"><i class="fa-solid fa-laptop-code"></i> Web Tech</div>
            <div class="skill-tag"><i class="fa-solid fa-database"></i> Basis Data</div>
            <div class="skill-tag"><i class="fa-solid fa-palette"></i> Desain Grafis</div>
        </div>

        <!-- Statistik -->
        <div class="stats-grid">
            <div class="stat-item">
                <h3>10+</h3>
                <p>Proyek Desain</p>
            </div>
            <div class="stat-item">
                <h3>Cloud</h3>
                <p>Eksplorasi</p>
            </div>
            <div class="stat-item">
                <h3>100%</h3>
                <p>Semangat</p>
            </div>
        </div>

        <!-- Tombol Kontak -->
        <a href="mailto:mahasiswa@email.com" class="btn-contact">
            <i class="fa-solid fa-paper-plane"></i> Hubungi Saya
        </a>
        <span class="email-text">mahasiswa@email.com</span>
    </div>

    <script>
        const canvas = document.getElementById('effectsCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        /* --- 1. KELOPAK BUNGA NEON --- */
        class Petal {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -20;
                this.size = Math.random() * 7 + 5;
                this.speedY = Math.random() * 1.5 + 0.8;
                this.speedX = Math.random() * 1 - 0.5;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 2 - 1;
                this.opacity = Math.random() * 0.6 + 0.4;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.y * 0.02) * 0.5;
                this.rotation += this.rotationSpeed;

                if (this.y > canvas.height + 20) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff003c';
                ctx.fillStyle = `rgba(255, 0, 60, ${this.opacity})`;

                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size / 2, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        const petalsArray = [];
        for (let i = 0; i < 30; i++) {
            petalsArray.push(new Petal());
            petalsArray[i].y = Math.random() * canvas.height;
        }

        /* --- 2. NAGA NEON (KEPALA TEBAL, EKOR TIPIS, GLOW KUAT) --- */
        const numSegments = 35;
        const dragonSegments = [];
        const segmentLength = 10;

        for (let i = 0; i < numSegments; i++) {
            dragonSegments.push({ x: mouse.x, y: mouse.y, angle: 0 });
        }

        function updateAndDrawDragon() {
            dragonSegments[0].x += (mouse.x - dragonSegments[0].x) * 0.25;
            dragonSegments[0].y += (mouse.y - dragonSegments[0].y) * 0.25;

            for (let i = 1; i < numSegments; i++) {
                const prev = dragonSegments[i - 1];
                const curr = dragonSegments[i];
                const dx = prev.x - curr.x;
                const dy = prev.y - curr.y;
                curr.angle = Math.atan2(dy, dx);
                curr.x = prev.x - Math.cos(curr.angle) * segmentLength;
                curr.y = prev.y - Math.sin(curr.angle) * segmentLength;
            }

            // Set Pendaran Cahaya Neon Kuat
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#ff003c';
            ctx.strokeStyle = '#ff1a4b';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Gambar badan naga bertahap dari tebal ke tipis
            for (let i = 0; i < numSegments - 1; i++) {
                ctx.beginPath();
                ctx.moveTo(dragonSegments[i].x, dragonSegments[i].y);
                ctx.lineTo(dragonSegments[i + 1].x, dragonSegments[i + 1].y);
                
                // Kepala (i=0) sangat tebal (ukuran 10), menyusut halus hingga ke ekor (ukuran tipis 0.8)
                ctx.lineWidth = Math.max(0.8, (numSegments - i) * 0.35);
                ctx.stroke();
            }

            // Kepala Naga: Lingkaran/Titik Terang Menyala Besar di Kursor
            const head = dragonSegments[0];
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ffffff';
            ctx.beginPath();
            ctx.arc(head.x, head.y, 6, 0, Math.PI * 2);
            ctx.fill();
        }

        /* --- LOOP RENDER UTAMA --- */
        function renderScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < petalsArray.length; i++) {
                petalsArray[i].update();
                petalsArray[i].draw();
            }

            updateAndDrawDragon();

            requestAnimationFrame(renderScene);
        }
        renderScene();

        /* --- SKRIP EFEK KETIKAN --- */
        const words = [
            "Mendalami Teknologi Cloud & Internet...", 
            "Berfokus pada Desain Grafis & Kreatif...", 
            "Mengelola Portofolio Informasi Digital..."
        ];
        let i = 0;
        let timer;

        function typingEffect() {
            let word = words[i].split("");
            var loopTyping = function() {
                if (word.length > 0) {
                    document.getElementById('typedOutput').innerHTML += word.shift();
                } else {
                    setTimeout(deletingEffect, 2000);
                    return false;
                }
                timer = setTimeout(loopTyping, 80);
            };
            loopTyping();
        }

        function deletingEffect() {
            let word = words[i].split("");
            var loopDeleting = function() {
                if (word.length > 0) {
                    word.pop();
                    document.getElementById('typedOutput').innerHTML = word.join("");
                } else {
                    if (words.length > (i + 1)) {
                        i++;
                    } else {
                        i = 0;
                    }
                    setTimeout(typingEffect, 500);
                    return false;
                }
                timer = setTimeout(loopDeleting, 40);
            };
            loopDeleting();
        }

        typingEffect();
    </script>
</body>
</html>
