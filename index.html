<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Mahasiswa - Interactive Dragon Edition</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #09090b, #18181b, #200a0a);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Canvas Animasi Naga Gambar Ikut Kursor */
        #dragonCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        /* Efek Cahaya Latar Belakang Merah */
        .bg-shapes div {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.35;
            animation: pulse 8s infinite alternate ease-in-out;
        }
        .shape1 { width: 400px; height: 400px; background: #dc2626; top: 10%; left: 10%; }
        .shape2 { width: 350px; height: 350px; background: #991b1b; bottom: 10%; right: 10%; animation-delay: 3s; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.1); opacity: 0.5; }
        }

        /* Kartu Profil Utama */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(18, 18, 20, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(220, 38, 38, 0.3);
            max-width: 500px;
            width: 90%;
            margin: 20px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 25px rgba(220, 38, 38, 0.15);
            text-align: center;
        }

        /* Badge Mahasiswa */
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.5);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #a1a1aa;
            margin-bottom: 25px;
        }

        /* Typing Effect */
        .typing-container {
            font-size: 1.05rem;
            color: #ef4444;
            margin-bottom: 30px;
            font-weight: 500;
            min-height: 30px;
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
        }
        .typed-text {
            border-right: 2px solid #ef4444;
            padding-right: 4px;
            animation: blink 0.75s infinite;
        }
        @keyframes blink {
            0%, 100% { border-color: transparent; }
            50% { border-color: #ef4444; }
        }

        /* Tags Keahlian */
        .skills-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 35px;
        }

        .skill-tag {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #f4f4f5;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .skill-tag:hover {
            background: rgba(220, 38, 38, 0.15);
            border-color: #dc2
