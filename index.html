<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Mahasiswa - MSI Dragon Edition</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #08080a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Canvas Naga di Latar Belakang */
        #dragonCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        /* Efek Cahaya Ambient Merah */
        .bg-shapes div {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.25;
            animation: float 8s infinite alternate ease-in-out;
        }
        .shape1 { width: 350px; height: 350px; background: #dc2626; top: 10%; left: 15%; }
        .shape2 { width: 300px; height: 300px; background: #991b1b; bottom: 10%; right: 15%; animation-delay: 3s; }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-30px) scale(1.05); }
        }

        /* Kartu Profil Utama */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(15, 15, 18, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(220, 38, 38, 0.35);
            max-width: 540px;
            width: 90%;
            margin: 20px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(220, 38, 38, 0.2);
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.5);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #a1a1aa;
            margin-bottom: 25px;
        }

        .typing-container {
            font-size: 1.05rem;
            color: #ef4444;
            margin-bottom: 30px;
            font-weight: 500;
            min-height: 30px;
        }
        .typed-text {
            border-right: 2px solid #ef4444;
            padding-right: 4px;
            animation: blink 0.75s infinite;
        }
        @keyframes blink {
            0%, 100% { border-color: transparent; }
            50% { border-color: #ef4444; }
        }

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 35px;
        }

        .skill-tag {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #f4f4f5;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .skill-tag:hover {
            background: rgba(220, 38, 38, 0.2);
            border-color: #dc2626;
            color: #fca5a5;
            transform: translateY(-3px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-item h3 {
            font-size: 1.25rem;
            color: #ef4444;
            font-weight: 700;
        }

        .stat-item p {
            font-size: 0.8rem;
            color: #a1a1aa;
            margin-top: 4px;
        }

        .btn-contact {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #dc2626, #991b1b);
            color: white;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 10px 25px rgba(220, 38, 38, 0.4);
            transition: all 0.3s ease;
        }

        .btn-contact:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(220, 38, 38, 0.7);
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .email-text {
            display: block;
            margin-top: 15px;
            font-size: 0.85rem;
            color: #a1a1aa;
        }
    </style>
</head>
<body>

    <!-- Canvas untuk Animasi Naga Neon -->
    <canvas id="dragonCanvas"></canvas>

    <div class="bg-shapes">
        <div class="shape1"></div>
        <div class="shape2"></div>
    </div>

    <div class="card">
        <span class="badge"><i class="fa-solid fa-dragon"></i> Mahasiswa</span>
        <h1>call me Silvie</h1>
        <p class="subtitle">Manajemen Informasi Komunikasi</p>

        <div class="typing-container">
            <span class="typed-text" id="typedOutput"></span>
        </div>

        <div class="skills-container">
            <div class="skill-tag"><i class="fa-solid fa-cloud"></i> Cloud Computing</div>
            <div class="skill-tag"><i class="fa-solid fa-laptop-code"></i> Web Tech</div>
            <div class="skill-tag"><i class="fa-solid fa-database"></i> Basis Data</div>
            <div class="skill-tag"><i class="fa-solid fa-palette"></i> Desain Grafis</div>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <h3>10+</h3>
                <p>Proyek Desain</p>
            </div>
            <div class="stat-item">
                <h3>Cloud</h3>
                <p>Eksplorasi</p>
            </div>
            <div class="stat-item">
                <h3>100%</h3>
                <p>Semangat</p>
            </div>
        </div>

        <a href="mailto:mahasiswa@email.com" class="btn-contact">
            <i class="fa-solid fa-paper-plane"></i> Hubungi Saya
        </a>
        <span class="email-text">mahasiswa@email.com</span>
    </div>

    <script>
        // --- SKRIP EFEK KETIKAN ---
        const words = [
            "Mendalami Teknologi Cloud & Internet...", 
            "Berfokus pada Desain Grafis & Kreatif...", 
            "Mengelola Portofolio Informasi Digital..."
        ];
        let wordIndex = 0;

        function typingEffect() {
            let word = words[wordIndex].split("");
            var loopTyping = function() {
                if (word.length > 0) {
                    document.getElementById('typedOutput').innerHTML += word.shift();
                } else {
                    setTimeout(deletingEffect, 2000);
                    return false;
                }
                setTimeout(loopTyping, 80);
            };
            loopTyping();
        }

        function deletingEffect() {
            let word = words[wordIndex].split("");
            var loopDeleting = function() {
                if (word.length > 0) {
                    word.pop();
                    document.getElementById('typedOutput').innerHTML = word.join("");
                } else {
                    wordIndex = (wordIndex + 1) % words.length;
                    setTimeout(typingEffect, 500);
                    return false;
                }
                setTimeout(loopDeleting, 40);
            };
            loopDeleting();
        }
        typingEffect();

        // --- SKRIP ANIMASI BENTUK NAGA NEON (CURSOR FOLLOWER) ---
        const canvas = document.getElementById('dragonCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // Segmen Tubuh Naga Panjang
        const numSegments = 32;
        const dragonSegments = [];
        const segmentLength = 12;

        for (let i = 0; i < numSegments; i++) {
            dragonSegments.push({ x: mouse.x, y: mouse.y, angle: 0 });
        }

        function animateDragon() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Pergerakan kepala mengikuti kursor
            dragonSegments[0].x += (mouse.x - dragonSegments[0].x) * 0.2;
            dragonSegments[0].y += (mouse.y - dragonSegments[0].y) * 0.2;

            // Rangkaian posisi tubuh naga (Inverse Kinematics)
            for (let i = 1; i < numSegments; i++) {
                const prev = dragonSegments[i - 1];
                const curr = dragonSegments[i];
                const dx = prev.x - curr.x;
                const dy = prev.y - curr.y;
                curr.angle = Math.atan2(dy, dx);
                curr.x = prev.x - Math.cos(curr.angle) * segmentLength;
                curr.y = prev.y - Math.sin(curr.angle) * segmentLength;
            }

            // Render Naga dari Ekor ke Kepala
            for (let i = numSegments - 1; i >= 0; i--) {
                const seg = dragonSegments[i];
                
                ctx.save();
                ctx.translate(seg.x, seg.y);
                ctx.rotate(seg.angle);

                // Efek Cahaya Neon Merah
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff1a1a';

                if (i === 0) {
                    // --- KEPALA NAGA ---
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.moveTo(14, 0);
                    ctx.lineTo(-8, -10);
                    ctx.lineTo(-4, 0);
                    ctx.lineTo(-8, 10);
                    ctx.closePath();
                    ctx.fill();

                    // Tanduk /
