<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Mahasiswa - MSI Dragon Edition</title>
    <!-- Google Fonts & FontAwesome untuk Ikon -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Latar Belakang Hitam Gelap ala MSI */
            background: linear-gradient(135deg, #09090b, #18181b, #200a0a);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Efek Cahaya Merah di Latar Belakang */
        .bg-shapes div {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.35;
            animation: pulse 8s infinite alternate ease-in-out;
        }
        .shape1 { width: 400px; height: 400px; background: #dc2626; top: 10%; left: 10%; }
        .shape2 { width: 350px; height: 350px; background: #991b1b; bottom: 10%; right: 10%; animation-delay: 3s; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.1); opacity: 0.5; }
        }

        /* Pembungkus Utama (Naga + Kartu Profil) */
        .main-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            z-index: 10;
            max-width: 1100px;
            width: 90%;
            padding: 20px 0;
        }

        /* Container & Animasi Gambar Naga */
        .dragon-wrapper {
            flex: 1;
            max-width: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: dragonFloat 5s ease-in-out infinite alternate;
        }

        .dragon-img {
            width: 100%;
            height: auto;
            /* Efek Menyala / Glow Neon Merah */
            filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.8)) drop-shadow(0 0 35px rgba(220, 38, 38, 0.5));
            transition: transform 0.3s ease;
        }

        /* Animasi Melayang Anggun Naga */
        @keyframes dragonFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(1deg); }
            100% { transform: translateY(-20px) rotate(-1deg); }
        }

        /* Kartu Profil Glassmorphism */
        .card {
            flex: 1;
            background: rgba(18, 18, 20, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(220, 38, 38, 0.3);
            max-width: 480px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 25px rgba(220, 38, 38, 0.15);
            text-align: center;
        }

        /* Badge Mahasiswa */
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.5);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #a1a1aa;
            margin-bottom: 25px;
        }

        /* Typing Effect */
        .typing-container {
            font-size: 1.05rem;
            color: #ef4444;
            margin-bottom: 30px;
            font-weight: 500;
            min-height: 30px;
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
        }
        .typed-text {
            border-right: 2px solid #ef4444;
            padding-right: 4px;
            animation: blink 0.75s infinite;
        }
        @keyframes blink {
            0%, 100% { border-color: transparent; }
            50% { border-color: #ef4444; }
        }

        /* Tags Keahlian */
        .skills-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 35px;
        }

        .skill-tag {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #f4f4f5;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .skill-tag:hover {
            background: rgba(220, 38, 38, 0.15);
            border-color: #dc2626;
            color: #fca5a5;
            transform: translateY(-3px);
        }

        /* Statistik Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-item h3 {
            font-size: 1.25rem;
            color: #ef4444;
            font-weight: 700;
        }

        .stat-item p {
            font-size: 0.8rem;
            color: #a1a1aa;
            margin-top: 4px;
        }

        /* Tombol Kontak */
        .btn-contact {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #dc2626, #991b1b);
            color: white;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 10px 25px rgba(220, 38, 38, 0.4);
            transition: all 0.3s ease;
        }

        .btn-contact:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(220, 38, 38, 0.7);
        }

        .email-text {
            display: block;
            margin-top: 15px;
            font-size: 0.85rem;
            color: #a1a1aa;
        }

        /* Tampilan HP */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .dragon-wrapper {
                max-width: 260px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-shapes">
        <div class="shape1"></div>
        <div class="shape2"></div>
    </div>

    <div class="main-container">
        <!-- Memanggil File Gambar Naga dari GitHub -->
        <div class="dragon-wrapper">
            <img src="naga.png" alt="Neon Red Dragon" class="dragon-img">
        </div>

        <div class="card">
            <span class="badge"><i class="fa-solid fa-graduation-cap"></i> Mahasiswa</span>
            <h1>Nama Silvia</h1>
            <p class="subtitle">Manajemen Informasi Komunikasi</p>

            <div class="typing-container">
                <span class="typed-text" id="typedOutput"></span>
            </div>

            <div class="skills-container">
                <div class="skill-tag"><i class="fa-solid fa-cloud"></i> Cloud Computing</div>
                <div class="skill-tag"><i class="fa-solid fa-laptop-code"></i> Web Tech</div>
                <div class="skill-tag"><i class="fa-solid fa-database"></i> Basis Data</div>
                <div class="skill-tag"><i class="fa-solid fa-palette"></i> Desain Grafis</div>
            </div>

            <div class="stats-grid">
                <div class="stat-item">
                    <h3>10+</h3>
                    <p>Proyek Desain</p>
                </div>
                <div class="stat-item">
                    <h3>Cloud</h3>
                    <p>Eksplorasi</p>
                </div>
                <div class="stat-item">
                    <h3>100%</h3>
                    <p>Semangat</p>
                </div>
            </div>

            <a href="mailto:mahasiswa@email.com" class="btn-contact">
                <i class="fa-solid fa-paper-plane"></i> Hubungi Saya
            </a>
            <span class="email-text">mahasiswa@email.com</span>
        </div>
    </div>

    <script>
        const words = [
            "Mendalami Teknologi Cloud & Internet...", 
            "Berfokus pada Desain Grafis & Kreatif...", 
            "Mengelola Portofolio Informasi Digital..."
        ];
        let i = 0;
        let timer;

        function typingEffect() {
            let word = words[i].split("");
            var loopTyping = function() {
                if (word.length > 0) {
                    document.getElementById('typedOutput').innerHTML += word.shift();
                } else {
                    setTimeout(deletingEffect, 2000);
                    return false;
                }
                timer = setTimeout(loopTyping, 80);
            };
            loopTyping();
        }

        function deletingEffect() {
            let word = words[i].split("");
            var loopDeleting = function() {
                if (word.length > 0) {
                    word.pop();
                    document.getElementById('typedOutput').innerHTML = word.join("");
                } else {
                    if (words.length > (i + 1)) {
                        i++;
                    } else {
                        i = 0;
                    }
                    setTimeout(typingEffect, 500);
                    return false;
                }
                timer = setTimeout(loopDeleting, 40);
            };
            loopDeleting();
        }

        typingEffect();
    </script>
</body>
</html>
