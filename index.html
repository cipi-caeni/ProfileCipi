<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Mahasiswa - Creative Studio</title>
    <!-- Google Fonts & FontAwesome untuk Ikon -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Elemen Animasi Latar Belakang (Pengganti Laba-laba) */
        .bg-shapes div {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.4;
            animation: float 8s infinite alternate ease-in-out;
        }
        .shape1 { width: 300px; height: 300px; background: #6366f1; top: 10%; left: 15%; }
        .shape2 { width: 350px; height: 350px; background: #ec4899; bottom: 10%; right: 15%; animation-delay: 3s; }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-30px) scale(1.05); }
        }

        /* Kartu Utama Profil (Glassmorphism) */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 540px;
            width: 90%;
            margin: 20px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        /* Badge Mahasiswa */
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        /* Efek Ketikan (Typing Text) */
        .typing-container {
            font-size: 1.05rem;
            color: #38bdf8;
            margin-bottom: 30px;
            font-weight: 500;
            min-height: 30px;
        }
        .typed-text {
            border-right: 2px solid #38bdf8;
            padding-right: 4px;
            animation: blink 0.75s infinite;
        }
        @keyframes blink {
            0%, 100% { border-color: transparent; }
            50% { border-color: #38bdf8; }
        }

        /* Kotak Keahlian (Tags) */
        .skills-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 35px;
        }

        .skill-tag {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .skill-tag:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: #6366f1;
            transform: translateY(-3px);
        }

        /* Statistik / Informasi Angka */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-item h3 {
            font-size: 1.25rem;
            color: #f43f5e;
            font-weight: 700;
        }

        .stat-item p {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* Tombol Kontak */
        .btn-contact {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            color: white;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
            transition: all 0.3s ease;
        }

        .btn-contact:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(236, 72, 153, 0.6);
        }

        .email-text {
            display: block;
            margin-top: 15px;
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- Elemen Latar Belakang Estetik -->
    <div class="bg-shapes">
        <div class="shape1"></div>
        <div class="shape2"></div>
    </div>

    <!-- Kartu Profil Utama -->
    <div class="card">
        <span class="badge"><i class="fa-solid fa-graduation-cap"></i> Mahasiswa</span>
        <h1>call me Silvie</h1>
        <p class="subtitle">Manajemen Informasi Komunikasi</p>

        <!-- Bagian Efek Ketikan Otomatis -->
        <div class="typing-container">
            <span class="typed-text" id="typedOutput"></span>
        </div>

        <!-- Daftar Keahlian / Minat -->
        <div class="skills-container">
            <div class="skill-tag"><i class="fa-solid fa-cloud"></i> Cloud Computing</div>
            <div class="skill-tag"><i class="fa-solid fa-laptop-code"></i> Web Tech</div>
            <div class="skill-tag"><i class="fa-solid fa-database"></i> Basis Data</div>
            <div class="skill-tag"><i class="fa-solid fa-palette"></i> Desain Grafis</div>
        </div>

        <!-- Kotak Statistik Kreatif -->
        <div class="stats-grid">
            <div class="stat-item">
                <h3>10+</h3>
                <p>Proyek Desain</p>
            </div>
            <div class="stat-item">
                <h3>Cloud</h3>
                <p>Eksplorasi</p>
            </div>
            <div class="stat-item">
                <h3>100%</h3>
                <p>Semangat</p>
            </div>
        </div>

        <!-- Tombol Aksi -->
        <a href="mailto:mahasiswa@email.com" class="btn-contact">
            <i class="fa-solid fa-paper-plane"></i> Hubungi Saya
        </a>
        <span class="email-text">mahasiswa@email.com</span>
    </div>

    <!-- Skrip JavaScript untuk Efek Ketikan Otomatis -->
    <script>
        const words = [
            "Mendalami Teknologi Cloud & Internet...", 
            "Berfokus pada Desain Grafis & Kreatif...", 
            "Mengelola Portofolio Informasi Digital..."
        ];
        let i = 0;
        let timer;

        function typingEffect() {
            let word = words[i].split("");
            var loopTyping = function() {
                if (word.length > 0) {
                    document.getElementById('typedOutput').innerHTML += word.shift();
                } else {
                    setTimeout(deletingEffect, 2000);
                    return false;
                }
                timer = setTimeout(loopTyping, 80);
            };
            loopTyping();
        }

        function deletingEffect() {
            let word = words[i].split("");
            var loopDeleting = function() {
                if (word.length > 0) {
                    word.pop();
                    document.getElementById('typedOutput').innerHTML = word.join("");
                } else {
                    if (words.length > (i + 1)) {
                        i++;
                    } else {
                        i = 0;
                    }
                    setTimeout(typingEffect, 500);
                    return false;
                }
                timer = setTimeout(loopDeleting, 40);
            };
            loopDeleting();
        }

        typingEffect();
    </script>
</body>
</html>
